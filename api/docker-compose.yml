services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em api/.env}
      POSTGRES_DB: ecoscan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecoscan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minha_rede

  api:
    build:
      context: .
      dockerfile: ecoscan/Dockerfile
    container_name: ecoscan_api
    restart: always
    ports:
      - "127.0.0.1:18000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em api/.env}@db:5432/ecoscan}
      ECOSCAN_MODEL_PATH: /app/ecoscan/best.pt
      ECOSCAN_METADATA_PATH: /app/ecoscan/model_metadata.json
      PASSWORD_RESET_EXPOSE_TOKEN: ${PASSWORD_RESET_EXPOSE_TOKEN:-true}
    volumes:
      - type: bind
        source: ${ECOSCAN_MODEL_HOST_PATH}
        target: /app/ecoscan/best.pt
        read_only: true
      - type: bind
        source: ./ecoscan/model_metadata.json
        target: /app/ecoscan/model_metadata.json
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/plants/health')); assert data['model_loaded']",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - minha_rede

volumes:
  postgres_data:

networks:
  minha_rede:
    driver: bridge
