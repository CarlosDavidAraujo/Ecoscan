services:
  api:
    build:
      context: .
      dockerfile: ecoscan/Dockerfile
    container_name: ecoscan_api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo api/.env}
      ECOSCAN_MODEL_PATH: /app/ecoscan/best.pt
      ECOSCAN_METADATA_PATH: /app/ecoscan/model_metadata.json
      PASSWORD_RESET_EXPOSE_TOKEN: ${PASSWORD_RESET_EXPOSE_TOKEN:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/plants/health')); assert data['model_loaded']",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: ecoscan/Dockerfile
    container_name: ecoscan_worker
    restart: always
    command: ["python", "-m", "ecoscan.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo api/.env}
      ECOSCAN_MODEL_PATH: /app/ecoscan/best.pt
      ECOSCAN_METADATA_PATH: /app/ecoscan/model_metadata.json
